<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <meta name="description" content="Watch Unseen Paths by Miguel Rodriguez.">
  <title>Unseen Paths - Miguel Rodriguez</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10120f;
      color: #f4f1e9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(172, 117, 63, .18), transparent 55%),
        #10120f;
    }

    main { width: min(100%, 1000px); }

    .eyebrow {
      margin: 0 0 14px;
      color: #c9a77d;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 8vw, 5.8rem);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1;
    }

    .byline {
      margin: 16px 0 30px;
      color: #b6b5ad;
      font-size: 1rem;
    }

    .player {
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 8px;
      background: #050605;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
    }

    .player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .caption {
      margin: 18px 0 0;
      color: #898b83;
      font-size: .875rem;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body { padding: 28px 16px; }
      .byline { margin-bottom: 22px; }
      .player { border-radius: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A film by Miguel Rodriguez</p>
    <h1>Unseen Paths</h1>
    <p class="byline">Watch the film</p>
    <div class="player">
      <iframe
        src="https://www.youtube-nocookie.com/embed/iMay-Hxo0ag"
        title="Unseen Paths by Miguel Rodriguez"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <p class="caption">Select play to watch. Playback is provided by YouTube.</p>
  </main>
</body>
</html>
